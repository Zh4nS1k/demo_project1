# ─────────────────────────────────────────────────────────────
# CI — runs on every push and pull request
#   • Server: 62 jest tests against an in-memory MongoDB
#   • Client: offline-resilience harness + production build
# Both jobs run in parallel; failure blocks PR merge (with branch protection).
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: 🧪 Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (in-memory MongoDB)
        env:
          NODE_ENV: test
        run: npx jest --runInBand --ci

  client-checks:
    name: 🎨 Client build + harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Offline-resilience harness
        run: npm run test:offline

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
