# ─────────────────────────────────────────────────────────────
# CD — deploy to Vercel (client) and Render (server)
#
# Trigger: runs automatically when the CI workflow completes
# successfully on main (push or PR merge). Manual deploys are
# also possible from the Actions tab (workflow_dispatch).
#
# Prerequisites (add these repository secrets — see DEPLOYMENT.md):
#   VERCEL_TOKEN          → Vercel → Settings → Tokens
#   VERCEL_ORG_ID        → vercel link output / project settings
#   VERCEL_PROJECT_ID    → project ID of the *client* app in Vercel
#   RENDER_API_KEY       → Render → Account Settings → API Keys
#   RENDER_SERVICE_ID    → your API web service ID (from its dashboard URL)
# ─────────────────────────────────────────────────────────────
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # manual deploy from the Actions tab

concurrency:
  group: cd-main
  cancel-in-progress: true

jobs:
  # CI must have passed (auto runs); manual dispatch skips the gate
  gate:
    name: 🚦 CI passed?
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "🟢 CI green (or manual dispatch) — proceeding to deploy"

  deploy-client:
    name: ▲ Client → Vercel
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel (production)
        run: npx vercel@latest deploy --prod --yes --cwd client
          --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Done
        run: echo "🌐 Client deployed — URL in the Vercel dashboard / step log above"

  deploy-server:
    name: ⚡ Server → Render
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - name: Trigger Render deploy
        run: |
          echo "🚀 Triggering Render deploy…"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys")
          if [ "$STATUS" != "201" ]; then
            echo "❌ Render deploy trigger failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Deploy triggered — rollout visible in the Render dashboard"
